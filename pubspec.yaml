name: cybershield_identity_guard
description: App that detects identity theft - before it ruins you.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.13.0
  firebase_messaging: ^14.7.0
  google_mlkit_face_detection: ^0.10.0
  google_mlkit_text_recognition: ^0.11.0
  http: ^1.1.0
  pdf: ^3.10.0
  printing: ^5.11.0
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/